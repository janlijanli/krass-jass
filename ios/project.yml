# XcodeGen spec for the iOS app. The .xcodeproj is generated, not committed:
#
#   brew install xcodegen
#   ios/scripts/bootstrap.sh        # engine + icon + strings + project
#   open ios/KrassJass.xcodeproj
#
# See ios/README.md.
name: KrassJass
options:
  bundleIdPrefix: ch.krassjass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KrassJass:
    type: application
    platform: iOS
    sources:
      - path: KrassJass
    # A shared scheme, so `xcodebuild -scheme KrassJass` works on a machine that never opened Xcode.
    scheme: {}
    dependencies:
      # The Rust engine as a static library — built by scripts/build-rust.sh, not in git.
      - framework: Engine/KrassJassCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.krassjass.app
        PRODUCT_NAME: KrassJass
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: KrassJass/Engine/KrassJass-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/include
        # What the Rust standard library asks to be linked on Apple platforms.
        OTHER_LDFLAGS: -liconv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # Info.plist is generated from these; there is no plist file to keep in step.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Krass Jass
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
