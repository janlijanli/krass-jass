[project]
name = "krass-jass"
version = "0.1.0"
description = "Schieber Jass engine, bots and web app"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    # The arena tooling that fits the trump weights, the play model and the belief network is
    # numpy, and tests/test_belief_net.py imports it. Present in every working tree and missing
    # here, so CI failed collection the first time it installed the declared set.
    "numpy>=2.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # web/botclient.py talks to the bot services over HTTP. It was missing here and present
    # in every working tree, so nothing noticed until CI installed the declared set.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krass_jass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
