[package]
name = "krass-jass-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "krass_jass_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Optional so the same crate can target wasm32, where neither exists. `default = ["python"]`
# keeps `maturin build` working unchanged.
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:rayon"]
wasm = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
